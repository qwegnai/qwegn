<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" fill="none" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
  <title>QG Processor Logo</title>
  <desc>Minimal monoline microchip emblem with a notched die and the letters Q and G etched in the core.</desc>

  <!-- ==================== 20 PROCESSOR BUS PINS ==================== -->
  <g>
    <!-- Top Pins -->
    <line x1="220" y1="62" x2="220" y2="108" />
    <line x1="260" y1="62" x2="260" y2="108" />
    <line x1="300" y1="62" x2="300" y2="108" />
    <line x1="340" y1="62" x2="340" y2="108" />
    <line x1="380" y1="62" x2="380" y2="108" />
    <!-- Bottom Pins -->
    <line x1="220" y1="492" x2="220" y2="538" />
    <line x1="260" y1="492" x2="260" y2="538" />
    <line x1="300" y1="492" x2="300" y2="538" />
    <line x1="340" y1="492" x2="340" y2="538" />
    <line x1="380" y1="492" x2="380" y2="538" />
    <!-- Left Pins -->
    <line x1="62" y1="220" x2="108" y2="220" />
    <line x1="62" y1="260" x2="108" y2="260" />
    <line x1="62" y1="300" x2="108" y2="300" />
    <line x1="62" y1="340" x2="340" y2="340" />
    <line x1="62" y1="380" x2="108" y2="380" />
    <!-- Right Pins -->
    <line x1="492" y1="220" x2="538" y2="220" />
    <line x1="492" y1="260" x2="538" y2="260" />
    <line x1="492" y1="300" x2="538" y2="300" />
    <line x1="492" y1="340" x2="538" y2="340" />
    <line x1="492" y1="380" x2="538" y2="380" />
  </g>

  <!-- ==================== DIE FRAME ==================== -->
  <g>
    <path d="M 276 135 L 180 135 Q 135 135 135 180 L 135 276" />
    <path d="M 324 135 L 420 135 Q 465 135 465 180 L 465 276" />
    <path d="M 135 324 L 135 420 Q 135 465 180 465 L 276 465" />
    <path d="M 465 324 L 465 420 Q 465 465 420 465 L 324 465" />
  </g>

  <!-- ==================== LETTER "Q" ==================== -->
  <g>
    <rect x="180" y="175" width="112" height="250" rx="36" ry="36" />
    <line x1="246" y1="336" x2="346" y2="436" />
  </g>

  <!-- ==================== LETTER "G" ==================== -->
  <g>
    <path d="M 324 175 L 380 175 Q 412 175 412 207 L 412 268" />
    <path d="M 324 326 L 412 326 L 412 393 Q 412 425 380 425 L 324 425" />
  </g>
</svg>
