<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 755" width="720" height="453">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#112224"/>
      <stop offset="55%" stop-color="#081113"/>
      <stop offset="100%" stop-color="#040708"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192136" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0d1220" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clipCard340">
      <rect x="0" y="0" width="340" height="235" rx="16"/>
    </clipPath>
    <clipPath id="clipCard525">
      <rect x="0" y="0" width="525" height="235" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-weight: 400; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase; }
    .card { stroke: #1f3b3d; stroke-width: 1.25; rx: 16; }
  </style>
  <rect width="1200" height="755" fill="url(#bgGlow)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="400" y1="0" x2="400" y2="755"/>
    <line x1="800" y1="0" x2="800" y2="755"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 34)">
    <rect x="0" y="0" width="256" height="26" rx="13" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#34d399"/>
    <text x="26" y="17" fill="#34d399" class="badge">QWEGN ENGINE · MODEL PROFILE</text>
    <rect x="268" y="0" width="330" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="433" y="17" text-anchor="middle" fill="#6ee7b7" class="badge">NEEDLE RECALL: 3/3 @ 64K–1M (DENSE: 0/3–1/3)</text>
    <text x="0" y="62" fill="#f8fafc" class="title" font-size="33">SenseNova-Loop-9B-Preview (HQ4_G32 + LSA) on Qwegn</text>
    <text x="0" y="88" fill="#94a3b8" class="subtitle" font-size="14">56-Layer Looped Hybrid Architecture (32 Physical Layers · 2x Middle Loop [4..28] · 2-Stream Sinkhorn-20 mHC · 1M LSA)</text>
  </g>

  <!-- CARD 1: Prefill Speed -->
  <g transform="translate(60, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="150" height="22" rx="11" fill="#0c2a3a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="97" y="35" text-anchor="middle" fill="#38bdf8" class="badge">PROMPT INGESTION</text>
    <text x="22" y="96" fill="url(#cyanGrad)" class="title mono" font-size="44">1,749</text>
    <text x="178" y="94" fill="#38bdf8" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">1,749 tok/s @64K · 1,476 @1M</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">56 effective layers (14 Attn + 42 GDN)</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">2.83× faster than dense prefill @262K</text>
    <text x="22" y="206" fill="#38bdf8" class="mono" font-size="11.5">Per-iteration LSA Ward cluster state</text>
  </g>

  <!-- CARD 2: First Token Latency -->
  <g transform="translate(430, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="160" height="22" rx="11" fill="#281638" stroke="#a855f7" stroke-width="1"/>
    <text x="102" y="35" text-anchor="middle" fill="#c084fc" class="badge">FIRST-TOKEN LATENCY</text>
    <text x="22" y="96" fill="url(#purpleGrad)" class="title mono" font-size="44">64 ms</text>
    <text x="180" y="94" fill="#c084fc" class="title mono" font-size="16">TTFT</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">Cold 64 ms · Warm 7 ms</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">Prefix cache cuts 1,540-token prompt</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">from 1.15s cold down to 7 ms warm</text>
    <text x="22" y="206" fill="#c084fc" class="mono" font-size="11.5">164.4x warm prefix cache speedup</text>
  </g>

  <!-- CARD 3: Speculative MTP-3 -->
  <g transform="translate(800, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="156" height="22" rx="11" fill="#33230c" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="35" text-anchor="middle" fill="#fbbf24" class="badge">SPECULATIVE MTP-3</text>
    <text x="22" y="96" fill="url(#amberGrad)" class="title mono" font-size="44">93.9</text>
    <text x="155" y="94" fill="#fbbf24" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">102.4 Peak · 46.5 tok/s @1M Ctx</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">75.2 tok/s @64K · 70.4 tok/s @262K</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">1.82× faster than dense decode @262K</text>
    <text x="22" y="206" fill="#fbbf24" class="mono" font-size="11.5">Row-paired HQ4_G32 verify + fused mHC</text>
  </g>

  <!-- CARD 4: Looped Geometry & 1M LSA Ladder -->
  <g transform="translate(60, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="265" height="22" rx="11" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="154" y="35" text-anchor="middle" fill="#34d399" class="badge">LOOPED GEOMETRY &amp; 1M LSA LADDER</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">32 Physical → 56 Effective Layers · 64K–1M LSA</text>
    <text x="22" y="98" fill="#38bdf8" class="mono" font-size="11.5">• Loop + mHC   : 2x loop [4..28] · 2-stream Sinkhorn-20 mHC</text>
    <text x="22" y="123" fill="#38bdf8" class="mono" font-size="11.5">• 64K  ctx LSA : 1,749 tok/s prefill · 75.2 decode · Needle 3/3</text>
    <text x="22" y="148" fill="#38bdf8" class="mono" font-size="11.5">• 262K ctx LSA : 1,606 tok/s prefill · 70.4 decode · Needle 3/3</text>
    <text x="22" y="173" fill="#38bdf8" class="mono" font-size="11.5">• 1M   ctx LSA : 1,476 tok/s prefill · 46.5 decode · Needle 3/3</text>
    <text x="22" y="204" fill="#34d399" class="mono" font-size="11.5">Dense 64K/262K : 1,207 (0/3) / 568 (1/3) prefill — LSA is 2.83× faster</text>
  </g>

  <!-- CARD 5: Smartness & Needle Eval -->
  <g transform="translate(615, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="230" height="22" rx="11" fill="#17253b" stroke="#38bdf8" stroke-width="1"/>
    <text x="137" y="35" text-anchor="middle" fill="#38bdf8" class="badge">SMARTNESS &amp; NEEDLE FIDELITY</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">100% (3/3) 1M Needle Recall · 64% HumanEval</text>
    <text x="22" y="98" fill="#34d399" class="mono" font-size="11.5">• Needle (64K–1M): 3 / 3 (100%) w/ LSA vs 0/3 @64K &amp; 1/3 @262K Dense</text>
    <text x="22" y="123" fill="#34d399" class="mono" font-size="11.5">• HumanEval / MBPP: 32/50 (64%) HumanEval · 14/50 (28%) MBPP</text>
    <text x="22" y="148" fill="#c084fc" class="mono" font-size="11.5">• Looped State    : 14 independent KV &amp; LSA Ward caches across 2 loops</text>
    <text x="22" y="173" fill="#fbbf24" class="mono" font-size="11.5">• Memory @ 1M Ctx : 24.93 GiB RSS (7.5 GB pack + q4 KV + LSA)</text>
    <text x="22" y="204" fill="#38bdf8" class="mono" font-size="11.5">Steady Allocations: 0 heap / 0 Metal buffer allocations</text>
  </g>
  <g transform="translate(60, 695)">
    <rect x="0" y="0" width="1080" height="32" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
    <text x="540" y="20" text-anchor="middle" fill="#94a3b8" class="mono" font-size="10.5">Qwegn Engine · Model: ~/.qwg/models/SenseNova-Loop-9B-Preview · Tested on Apple M5 Max (Mac17,6 · 128 GB Unified Memory · 40-core GPU · 585 GB/s DRAM)</text>
  </g>
</svg>
