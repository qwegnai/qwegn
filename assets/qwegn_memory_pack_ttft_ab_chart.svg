  <text x="600" y="438" text-anchor="middle" class="mono" font-size="11" fill="#64748b">Qwegn v0.11.3 · Apple M5 Max (128 GB) · Paired Interleaved A/B (min of 2 alternating rounds) &amp; 179.2K Large-Volume Prefix Hit.</text>
