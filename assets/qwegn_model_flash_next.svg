    <text x="22" y="96" fill="url(#purpleGrad)" class="title mono" font-size="44">113.7</text>
    <text x="174" y="94" fill="#c084fc" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">113 ms TTFT · 45.4 tok/s @1M</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">2.09x faster TTFT vs mlx-serve (236 ms)</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">144.1 tok/s 4-stream batching (+64.9%)</text>
    <text x="22" y="206" fill="#c084fc" class="mono" font-size="11.5">81.7 @64K · 72.3 @262K · 45.4 @1M</text>
  </g>

  <!-- CARD 3: Speculative MTP -->
  <g transform="translate(800, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="154" height="22" rx="11" fill="#33230c" stroke="#f59e0b" stroke-width="1"/>
    <text x="99" y="35" text-anchor="middle" fill="#fbbf24" class="badge">SPECULATIVE MTP</text>
    <text x="22" y="96" fill="url(#amberGrad)" class="title mono" font-size="44">142.7</text>
    <text x="176" y="94" fill="#fbbf24" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">3.49 tok/step Acceptance</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">106.6 tok/s novel speculation (+29.1%</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">faster than mlx-serve 82.6 tok/s)</text>
    <text x="22" y="206" fill="#fbbf24" class="mono" font-size="11.5">Adaptive EMA + Long-Context Backoff</text>
  </g>

  <!-- CARD 4: 1M Long Context Scaling (Native QSA vs qsa-cluster) -->
  <g transform="translate(60, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="275" height="22" rx="11" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="159" y="35" text-anchor="middle" fill="#34d399" class="badge">LONG-CONTEXT SCALING (64K → 1M Ctx)</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">Native QSA (auto) &amp; LSA Ward (qsa-cluster) · 3/3 Needle</text>
    <text x="22" y="98" fill="#38bdf8" class="mono" font-size="11.5">• 64K  Native QSA : 2,542 tok/s prefill · 81.7 decode · Needle 3/3</text>
    <text x="22" y="123" fill="#38bdf8" class="mono" font-size="11.5">• 262K Native QSA : 2,171 tok/s prefill · 72.3 decode · Needle 3/3</text>
    <text x="22" y="148" fill="#38bdf8" class="mono" font-size="11.5">• 1M   Native QSA : 1,353 tok/s prefill · 45.4 decode · Needle 3/3</text>
    <text x="22" y="173" fill="#fbbf24" class="mono" font-size="11.5">• qsa-cluster     : 2,280 (@64K) / 1,553 (@262K) prefill · Needle 3/3</text>
    <text x="22" y="204" fill="#34d399" class="mono" font-size="11.5">Memory @ 1M Ctx: 26.31 GiB RSS · --lsa-mode auto keeps Native QSA</text>
  </g>

  <!-- CARD 5: Smartness & Quantization Variants -->
  <g transform="translate(615, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="236" height="22" rx="11" fill="#281638" stroke="#a855f7" stroke-width="1"/>
    <text x="140" y="35" text-anchor="middle" fill="#c084fc" class="badge">SMARTNESS &amp; MIXED QUANTIZATION</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="16.5">100% Conformance · 100% Capability · 81% Code · 3/3 Needle</text>
    <text x="22" y="98" fill="#34d399" class="mono" font-size="11.5">• Conformance &amp; Capability : 131/131 (100%) · 18/18 (100%, 6/6 JSON)</text>
    <text x="22" y="123" fill="#34d399" class="mono" font-size="11.5">• Code Eval &amp; Fidelity     : 81/100 (HE 45 · MBPP 36) · 100% (topProb 0.966)</text>
    <text x="22" y="148" fill="#38bdf8" class="mono" font-size="11.5">• Mixed HQ8_G32 + HQ4_G64  : 71.30 GiB (-5.16 GiB vs hq4g32) · 2.62× lower KLD</text>
    <text x="22" y="173" fill="#c084fc" class="mono" font-size="11.5">• Agentic &amp; Needle (64K–1M): 87.5% (7/8, constrained tools) · 3/3 (100%) needle</text>
    <text x="22" y="204" fill="#fbbf24" class="mono" font-size="11.5">llmprobe v0.6.16 · greedy · --reasoning off · 100 code q</text>
  </g>
  <g transform="translate(60, 695)">
    <rect x="0" y="0" width="1080" height="32" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
    <text x="540" y="20" text-anchor="middle" fill="#94a3b8" class="mono" font-size="10.5">Qwegn Engine · Model: ~/.qwg/models/Qwen3.8-Flash-Next-hq8g32-hq4g64 · Tested on Apple M5 Max (Mac17,6 · 128 GB Unified Memory · 40-core GPU · 585 GB/s DRAM)</text>
