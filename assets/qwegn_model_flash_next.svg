  <!-- HEADER -->
  <g transform="translate(60, 34)">
    <rect x="0" y="0" width="256" height="26" rx="13" fill="#281638" stroke="#a855f7" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#c084fc"/>
    <text x="26" y="17" fill="#c084fc" class="badge">QWEGN ENGINE · MODEL PROFILE</text>
    <rect x="268" y="0" width="320" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="428" y="17" text-anchor="middle" fill="#6ee7b7" class="badge">NEEDLE RECALL: 3/3 @ 64K–1M (QSA &amp; CLUSTER)</text>
    <text x="0" y="62" fill="#f8fafc" class="title" font-size="31">Qwen3.8-Flash-Next (HQ8_G32 + HQ4_G64 + QSA/LSA) on Qwegn</text>
    <text x="0" y="88" fill="#94a3b8" class="subtitle" font-size="13.5">48-Layer Flagship Hybrid MoE (512 Experts · 10 Routed + 1 Shared · 12 QSA + 36 GDN · 4-Branch HC · PLE · 71.30 GiB) · Up to 1M Ctx</text>
  </g>

  <!-- CARD 1: Prefill & Cache -->
  <g transform="translate(60, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="150" height="22" rx="11" fill="#0c2a3a" stroke="#0ea5e9" stroke-width="1"/>
