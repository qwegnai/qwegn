    <text x="22" y="96" fill="url(#cyanGrad)" class="title mono" font-size="44">2,688</text>
    <text x="178" y="94" fill="#38bdf8" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">2,696 Peak · 1,353 tok/s @1M</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">+12.6% over mlx-serve (2,386.5) on</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">the same Qwen3.8-Flash-Next model</text>
    <text x="22" y="206" fill="#38bdf8" class="mono" font-size="11.5">7 ms warm TTFT (98.7x vs 691 ms)</text>
  </g>

  <!-- CARD 2: Decode & TTFT -->
  <g transform="translate(430, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="150" height="22" rx="11" fill="#281638" stroke="#a855f7" stroke-width="1"/>
