    <text x="22" y="96" fill="url(#purpleGrad)" class="title mono" font-size="44">45 ms</text>
    <text x="180" y="94" fill="#c084fc" class="title mono" font-size="16">TTFT</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">Cold 45 ms · Warm 5 ms</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">Prefix cache cuts 1,539-token prompt</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">from 275 ms cold down to 5 ms warm</text>
    <text x="22" y="206" fill="#c084fc" class="mono" font-size="11.5">55.0x warm prefix cache speedup</text>
  </g>

  <!-- CARD 3: Decode Throughput -->
  <g transform="translate(800, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="156" height="22" rx="11" fill="#33230c" stroke="#f59e0b" stroke-width="1"/>
    <text x="100" y="35" text-anchor="middle" fill="#fbbf24" class="badge">VARIATIONAL MTP-3</text>
    <text x="22" y="96" fill="url(#amberGrad)" class="title mono" font-size="44">233.4</text>
    <text x="176" y="94" fill="#fbbf24" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">238.5 Peak · 102.8 tok/s @1M</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">134.1 tok/s @64K · 125.7 tok/s @262K</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">4.7× faster than dense decode @524K</text>
    <text x="22" y="206" fill="#fbbf24" class="mono" font-size="11.5">LSA Sparse Decode + Auto MTP Backoff</text>
  </g>

  <!-- CARD 4: 1M LSA Context Ladder & Needle Recall -->
  <g transform="translate(60, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="275" height="22" rx="11" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="159" y="35" text-anchor="middle" fill="#34d399" class="badge">64K → 1M LSA LADDER &amp; NEEDLE RECALL</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">LSA (auto, k=2048) vs Dense (off) · 3-Needle Haystack</text>
    <text x="22" y="98" fill="#38bdf8" class="mono" font-size="11.5">• 64K  ctx : 6,005 prefill · 134.1 decode · Needle 3/3 (Dense: 0/3)</text>
    <text x="22" y="123" fill="#38bdf8" class="mono" font-size="11.5">• 128K ctx : 5,335 prefill · 133.0 decode · Needle 3/3 (Dense: 0/3)</text>
    <text x="22" y="148" fill="#38bdf8" class="mono" font-size="11.5">• 262K ctx : 3,791 prefill · 125.7 decode · Needle 3/3 (Dense: 0/3)</text>
    <text x="22" y="173" fill="#38bdf8" class="mono" font-size="11.5">• 524K ctx : 3,028 prefill · 109.3 decode · Needle 3/3 (13.1× prefill)</text>
    <text x="22" y="204" fill="#34d399" class="mono" font-size="11.5">• 1M   ctx : 2,294 prefill · 102.8 decode · Needle 3/3 (100% Recall)</text>
  </g>

  <!-- CARD 5: Smartness & Code Eval -->
  <g transform="translate(615, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="230" height="22" rx="11" fill="#17253b" stroke="#38bdf8" stroke-width="1"/>
    <text x="137" y="35" text-anchor="middle" fill="#38bdf8" class="badge">SMARTNESS &amp; NEEDLE FIDELITY</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">72% Code Eval · 100% (3/3) 1M Needle Recall</text>
    <text x="22" y="98" fill="#34d399" class="mono" font-size="11.5">• Needle (64K–1M): 3 / 3 (100%) retrieved w/ LSA vs 0/3 Dense</text>
    <text x="22" y="123" fill="#34d399" class="mono" font-size="11.5">• HumanEval / MBPP: 41/50 (82%) HumanEval · 31/50 (62%) MBPP</text>
    <text x="22" y="148" fill="#c084fc" class="mono" font-size="11.5">• LSA Selector    : 0.062 ms parallel radix top-k @ 1M tokens</text>
    <text x="22" y="173" fill="#fbbf24" class="mono" font-size="11.5">• Memory @ 1M Ctx : 30.25 GiB RSS (22.2 GB pack + q4 KV + LSA)</text>
    <text x="22" y="204" fill="#38bdf8" class="mono" font-size="11.5">Steady Allocations: 0 heap / 0 Metal buffer allocations</text>
  </g>
  <g transform="translate(60, 695)">
    <rect x="0" y="0" width="1080" height="32" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
    <text x="540" y="20" text-anchor="middle" fill="#94a3b8" class="mono" font-size="10.5">Qwegn Engine · Model: ~/.qwg/models/Qwen3.6-35B-A3B-hq4g32 · Tested on Apple M5 Max (Mac17,6 · 128 GB Unified Memory · 40-core GPU · 585 GB/s DRAM)</text>
  </g>
