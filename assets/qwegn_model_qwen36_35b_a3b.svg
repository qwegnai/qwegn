  <!-- HEADER -->
  <g transform="translate(60, 34)">
    <rect x="0" y="0" width="256" height="26" rx="13" fill="#0c2a3a" stroke="#0ea5e9" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#38bdf8"/>
    <text x="26" y="17" fill="#38bdf8" class="badge">QWEGN ENGINE · MODEL PROFILE</text>
    <rect x="268" y="0" width="320" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="428" y="17" text-anchor="middle" fill="#6ee7b7" class="badge">NEEDLE RECALL: 3/3 @ 64K–1M (DENSE: 0/3)</text>
    <text x="0" y="62" fill="#f8fafc" class="title" font-size="33">Qwen3.6-35B-A3B (HQ4_G32_M5 + LSA) on Qwegn</text>
    <text x="0" y="88" fill="#94a3b8" class="subtitle" font-size="14">40-Layer Sparse MoE (256 Experts · 8 Routed + 1 Shared · 10 Full-Attn w/ LSA + 30 GDN · Variational MTP-3) · Up to 1M Ctx</text>
  </g>

  <!-- CARD 1: Prefill Speed -->
  <g transform="translate(60, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="150" height="22" rx="11" fill="#0c2a3a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="97" y="35" text-anchor="middle" fill="#38bdf8" class="badge">PROMPT INGESTION</text>
    <text x="22" y="96" fill="url(#cyanGrad)" class="title mono" font-size="44">6,005</text>
    <text x="178" y="94" fill="#38bdf8" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">6,005 tok/s @64K · 2,294 @1M</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">6,389 tok/s peak · 13.1× faster than</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">dense prefill at 524K (3,028 vs 231)</text>
    <text x="22" y="206" fill="#38bdf8" class="mono" font-size="11.5">Apple10 NAX Sparse + Ward LSA</text>
  </g>

  <!-- CARD 2: First Token Latency -->
  <g transform="translate(430, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="160" height="22" rx="11" fill="#281638" stroke="#a855f7" stroke-width="1"/>
