    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="400" y1="0" x2="400" y2="755"/>
    <line x1="800" y1="0" x2="800" y2="755"/>
