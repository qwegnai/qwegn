      <text x="134" y="29" text-anchor="middle" class="mono" font-size="10" font-weight="700" fill="#fde68a">STANFORD MEMORILLA (arXiv:2610.21375)</text>
      <text x="16" y="58" class="sans" font-size="14" font-weight="800" fill="#f8fafc">Learned K=16 Soft-Token Bottleneck</text>
      <text x="16" y="82" class="mono" font-size="10.5" fill="#fcd34d">✗ Decoder-Manifold Lock-In:</text>
      <text x="28" y="98" class="sans" font-size="11" fill="#94a3b8">~19h on 4× H100 SFT+RL per frozen LLM</text>
      <text x="16" y="120" class="mono" font-size="10.5" fill="#fcd34d">✗ 100:1 Lossy Bottleneck (16 vecs = 128 KB):</text>
      <text x="28" y="136" class="sans" font-size="11" fill="#94a3b8">Destroys verbatim syntax, types &amp; line numbers</text>
      <text x="16" y="158" class="mono" font-size="10.5" fill="#fcd34d">✗ Static Query Conditioning (q₀ only):</text>
      <text x="28" y="174" class="sans" font-size="11" fill="#94a3b8">Injected once at Layer 0 before generation</text>
    </g>

    <!-- Card 3: Qwegn Two-Tier LSA Memory -->
