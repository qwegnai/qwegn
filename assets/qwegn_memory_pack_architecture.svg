      <text x="16" y="96" class="mono" font-size="10" fill="#cbd5e1">2. Score 64 Ward centroids / 512-tok</text>
      <text x="16" y="116" class="mono" font-size="10" fill="#cbd5e1">3. 2-pass Radix top-bucket expand</text>
      <text x="16" y="136" class="mono" font-size="10" fill="#34d399">4. Attend: Sink(4) + Top-k(2048)</text>
