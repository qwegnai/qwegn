    <text x="0" y="84" class="mono" font-size="12" font-weight="600" fill="#94a3b8">32.7K Resident Cortex · &lt;0.5 ms Causal Vault Paging · 96.9% Free 1M Context · Prefix-Invariant Multi-Turn State</text>
  </g>

