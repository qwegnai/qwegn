      <text x="28" y="136" class="sans" font-size="11" fill="#94a3b8">5–15 search/read turns before writing code</text>
      <text x="16" y="158" class="mono" font-size="10.5" fill="#fca5a5">✗ Blind Autonomous Tool Loops:</text>
      <text x="28" y="174" class="sans" font-size="11" fill="#94a3b8">Repeated shell searches during multi-step edits</text>
