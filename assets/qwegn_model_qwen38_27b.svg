<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 755" width="720" height="453">
  <defs>
    <radialGradient id="bgGlow" cx="20%" cy="10%" r="90%">
      <stop offset="0%" stop-color="#211815"/>
      <stop offset="55%" stop-color="#100c0b"/>
      <stop offset="100%" stop-color="#050404"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#192136" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#0d1220" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="clipCard340">
      <rect x="0" y="0" width="340" height="235" rx="16"/>
    </clipPath>
    <clipPath id="clipCard525">
      <rect x="0" y="0" width="525" height="235" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; font-weight: 800; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; font-weight: 400; }
    .mono { font-family: "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; font-weight: 700; font-size: 10.5px; letter-spacing: 0.4px; text-transform: uppercase; }
    .card { stroke: #452d24; stroke-width: 1.25; rx: 16; }
  </style>
  <rect width="1200" height="755" fill="url(#bgGlow)"/>
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="400" y1="0" x2="400" y2="755"/>
    <line x1="800" y1="0" x2="800" y2="755"/>
  </g>

  <!-- HEADER -->
  <g transform="translate(60, 34)">
    <rect x="0" y="0" width="256" height="26" rx="13" fill="#381b14" stroke="#f59e0b" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#fbbf24"/>
    <text x="26" y="17" fill="#fbbf24" class="badge">QWEGN ENGINE · MODEL PROFILE</text>
    <rect x="268" y="0" width="295" height="26" rx="13" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="415" y="17" text-anchor="middle" fill="#6ee7b7" class="badge">NEEDLE RECALL: 3/3 (100%) @ 64K–1M</text>
    <text x="0" y="62" fill="#f8fafc" class="title" font-size="33">Qwen3.8-27B (HQ4_G32 + DSpine / DFlash 2 + LSA) on Qwegn</text>
    <text x="0" y="88" fill="#94a3b8" class="subtitle" font-size="14">64-Layer Dense Hybrid (16 Full-Attn w/ LSA + 48 GDN) · DSpine B=16 + DFlash 2 + Variational MTP · Vision · 1M Ctx</text>
  </g>

  <!-- CARD 1: DSpine & DFlash 2 Speculation -->
  <g transform="translate(60, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="184" height="22" rx="11" fill="#33230c" stroke="#f59e0b" stroke-width="1"/>
    <text x="114" y="35" text-anchor="middle" fill="#fbbf24" class="badge">DSPINE &amp; DFLASH 2 BLOCK</text>
    <text x="318" y="35" text-anchor="end" fill="#fde68a" class="mono" font-size="11">4.19× Serial</text>
    <text x="22" y="96" fill="url(#amberGrad)" class="title mono" font-size="44">134.5</text>
    <text x="172" y="94" fill="#fbbf24" class="title mono" font-size="18">tok/s peak</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">Block-Causal &amp; Diffusion Drafters</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">• DSpine B=2..16: 134.5 peak · 100.5 mean</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">• Up to 12.70 tok/rd (B=16) · DFlash2 90.6</text>
    <text x="22" y="206" fill="#fbbf24" class="mono" font-size="11.5">5L GQA + Low-Rank Bridge + Conv1d (1.6 GB)</text>
  </g>

  <!-- CARD 2: Variational MTP-3 -->
  <g transform="translate(430, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="154" height="22" rx="11" fill="#281638" stroke="#a855f7" stroke-width="1"/>
    <text x="99" y="35" text-anchor="middle" fill="#c084fc" class="badge">VARIATIONAL MTP-3</text>
    <text x="22" y="96" fill="url(#purpleGrad)" class="title mono" font-size="44">91.3</text>
    <text x="155" y="94" fill="#c084fc" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">91.3 Peak · 43.1 tok/s @1M Ctx</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">50.7 tok/s @64K · 49.0 tok/s @262K</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">1.93× faster than dense decode @262K</text>
    <text x="22" y="206" fill="#c084fc" class="mono" font-size="11.5">95.5% MTP acceptance sustained at 1M</text>
  </g>

  <!-- CARD 3: Roofline Serial Bandwidth -->
  <g transform="translate(800, 145)" filter="url(#shadow)" clip-path="url(#clipCard340)">
    <rect width="340" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="160" height="22" rx="11" fill="#0c2a3a" stroke="#0ea5e9" stroke-width="1"/>
    <text x="102" y="35" text-anchor="middle" fill="#38bdf8" class="badge">LSA PREFILL &amp; CACHE</text>
    <text x="22" y="96" fill="url(#cyanGrad)" class="title mono" font-size="44">876</text>
    <text x="155" y="94" fill="#38bdf8" class="title mono" font-size="18">tok/s</text>
    <text x="22" y="128" fill="#f1f5f9" class="title" font-size="16">876 tok/s @64K · 805 tok/s @1M</text>
    <text x="22" y="153" fill="#94a3b8" class="subtitle" font-size="12.5">2.45× faster than dense prefill @262K</text>
    <text x="22" y="173" fill="#94a3b8" class="subtitle" font-size="12.5">(857.9 vs 350.8 tok/s · 6 ms warm hit)</text>
    <text x="22" y="206" fill="#38bdf8" class="mono" font-size="11.5">307.3x prefix cache · ~2.1s cold load</text>
  </g>

  <!-- CARD 4: Multimodal Vision & Geometry -->
  <g transform="translate(60, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="226" height="22" rx="11" fill="#062e22" stroke="#10b981" stroke-width="1"/>
    <text x="135" y="35" text-anchor="middle" fill="#34d399" class="badge">MULTIMODAL VISION &amp; GEOMETRY</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">64 Dense Layers · 5120 Hidden · 27-Block Vision</text>
    <text x="22" y="98" fill="#38bdf8" class="mono" font-size="11.5">• Text Backbone : 64 Layers · 5120 Hidden · GQA (24Q / 4KV)</text>
    <text x="22" y="123" fill="#38bdf8" class="mono" font-size="11.5">• Vision Tower  : 27 Blocks · 1152 Dim · 4304 MLP · [5120,4608]</text>
    <text x="22" y="148" fill="#38bdf8" class="mono" font-size="11.5">• Patch Conv3D  : Folded [1152, 3, 2, 16, 16] golden-verified</text>
    <text x="22" y="173" fill="#38bdf8" class="mono" font-size="11.5">• Pack Storage  : 14.9 GiB main + 1.6 GB DSpine / 1.4 GB DFlash2</text>
    <text x="22" y="204" fill="#34d399" class="mono" font-size="11.5">Supports multimodal image_url on /v1/chat/completions</text>
  </g>

  <!-- CARD 5: 1M LSA Scaling & Needle Recall -->
  <g transform="translate(615, 405)" filter="url(#shadow)" clip-path="url(#clipCard525)">
    <rect width="525" height="235" fill="url(#cardGrad)" class="card"/>
    <rect x="22" y="20" width="265" height="22" rx="11" fill="#33230c" stroke="#f59e0b" stroke-width="1"/>
    <text x="154" y="35" text-anchor="middle" fill="#fbbf24" class="badge">64K → 1M LSA &amp; NEEDLE PERFORMANCE</text>
    <text x="22" y="68" fill="#f1f5f9" class="title" font-size="17">100% (3/3) Needle Recall Across 64K, 262K &amp; 1M</text>
    <text x="22" y="98" fill="#34d399" class="mono" font-size="11.5">• 64K  ctx LSA : 876.1 tok/s prefill · 50.7 decode · Needle 3/3</text>
    <text x="22" y="123" fill="#34d399" class="mono" font-size="11.5">• 262K ctx LSA : 857.9 tok/s prefill · 49.0 decode · Needle 3/3</text>
    <text x="22" y="148" fill="#34d399" class="mono" font-size="11.5">• 1M   ctx LSA : 804.9 tok/s prefill · 43.1 decode · Needle 3/3</text>
    <text x="22" y="173" fill="#c084fc" class="mono" font-size="11.5">• Dense @ 262K : 350.8 tok/s prefill · 25.3 decode (2.45× slower)</text>
    <text x="22" y="204" fill="#38bdf8" class="mono" font-size="11.5">Memory @ 1M Ctx: 38.36 GiB RSS · 0 steady-state allocations</text>
  </g>
  <g transform="translate(60, 695)">
    <rect x="0" y="0" width="1080" height="32" rx="8" fill="#0d1322" stroke="#1e293b" stroke-width="1"/>
    <text x="540" y="20" text-anchor="middle" fill="#94a3b8" class="mono" font-size="10.5">Qwegn v0.12.0 · Models: Qwen3.8-27B-hq4g32 + DSpine-b16-hq4g32 &amp; DFlash2-hq4g32 · Apple M5 Max (128 GB RAM · 585 GB/s DRAM)</text>
  </g>
</svg>
