name: release
# Tag push (vX.Y.Z) builds the macOS .pkg installer (main artifact) and the
# portable .tar.gz archive (power users), optionally signing and notarizing
# when Apple Developer ID secrets are configured, and attaches both to the
# GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: macos-26
    env:
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DEVELOPER_ID_APP: ${{ secrets.APPLE_DEVELOPER_ID_APP }}
      APPLE_DEVELOPER_ID_INSTALLER: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26 or newer
        run: |
          best=""
          for app in /Applications/Xcode*.app; do
            v=$(defaults read "$app/Contents/Info" CFBundleShortVersionString 2>/dev/null || echo 0)
            if [ "${v%%.*}" -ge 26 ] 2>/dev/null; then best="$app"; fi
          done
          test -n "$best" || { echo "FAIL: no Xcode 26+ on this runner"; exit 1; }
          sudo xcode-select -s "$best/Contents/Developer"
          xcodebuild -version

      - name: Install the Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain || true

      - name: Import Apple Developer ID certificate (if configured)
        if: env.APPLE_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/qwegn-release.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign:,productsign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build (metallib + release binaries)
        run: |
          make metallib
          python3 Scripts/check_metallib_target.py
          swift build -c release --product qwg
          swift build -c release --product qwg-menu
          swift build -c release --product qwg-smc-helper
          BIN_DIR="$(swift build -c release --show-bin-path)"
          python3 Scripts/check_swifterror_abi.py "$BIN_DIR/qwg" "$BIN_DIR/qwg-menu" "$BIN_DIR/qwg-smc-helper"

      - name: Build macOS .pkg installer and portable .tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./Scripts/build_pkg.sh --skip-build --version "$VERSION" --output .

          STAGE="qwegn-${GITHUB_REF_NAME}-macos-arm64"
          mkdir -p "$STAGE"
          BIN_DIR="$(swift build -c release --show-bin-path)"
          cp "$BIN_DIR/qwg" "$STAGE/"
          ./Scripts/build_app.sh --skip-build --version "$VERSION" --output "$STAGE"
          cp Sources/QWMetal/kernel.metallib Sources/QWMetal/kernel_std.metallib Sources/QWMetal/kernel_m3.metallib Sources/QWMetal/kernel_m3_std.metallib "$STAGE/"
          if [ -d "$STAGE/Qwegn.app/Contents/Resources/qwegine_QWServer.bundle" ]; then
            ditto "$STAGE/Qwegn.app/Contents/Resources/qwegine_QWServer.bundle" "$STAGE/qwegine_QWServer.bundle"
          fi
          cp LICENSE README.md "$STAGE/"
          cat > "$STAGE/INSTALL.txt" <<'TXT'
          Qwegn — portable archive (for standard install, use the .pkg installer)
          1) xattr -dr com.apple.quarantine qwg Qwegn.app   # if unsigned
          2) ./qwg --help
          The CLI finds kernel*.metallib next to itself or inside Qwegn.app.
          TXT
          tar -czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "Qwegn-${VERSION}-macos-arm64.pkg" "$STAGE.tar.gz" > SHA256SUMS.txt

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES="$RUNNER_TEMP/release_notes.md"
          python3 - "$VERSION" "$NOTES" <<'PY'
          import pathlib, re, sys
          version, out_path = sys.argv[1], pathlib.Path(sys.argv[2])
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pat = re.compile(rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)", re.M | re.S)
          m = pat.search(text)
          body = m.group(1).strip() if m else ""
          out_path.write_text(body + ("\n" if body else ""), encoding="utf-8")
          PY
          echo "notes_file=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release with .pkg, .tar.gz, and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="Qwegn-${VERSION}-macos-arm64.pkg"
          TAR="qwegn-${GITHUB_REF_NAME}-macos-arm64.tar.gz"
          NOTES="${{ steps.notes.outputs.notes_file }}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ -s "$NOTES" ]; then
              gh release edit "$GITHUB_REF_NAME" --title "Qwegn $GITHUB_REF_NAME" --notes-file "$NOTES"
            else
              gh release edit "$GITHUB_REF_NAME" --title "Qwegn $GITHUB_REF_NAME"
            fi
            gh release upload "$GITHUB_REF_NAME" --clobber "$PKG" "$TAR" SHA256SUMS.txt
          else
            if [ -s "$NOTES" ]; then
              gh release create "$GITHUB_REF_NAME" \
                --title "Qwegn $GITHUB_REF_NAME" \
                --notes-file "$NOTES" \
                "$PKG" "$TAR" SHA256SUMS.txt
            else
              gh release create "$GITHUB_REF_NAME" \
                --title "Qwegn $GITHUB_REF_NAME" \
                --generate-notes \
                "$PKG" "$TAR" SHA256SUMS.txt
            fi
          fi

      - name: Clean up temporary signing keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
